# Local infrastructure for FinDoc. The API and the worker run on the host (dotnet run),
# and so does Ollama (http://localhost:11434), so only Postgres and RabbitMQ live here.
name: findoc

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: findoc
      POSTGRES_PASSWORD: findoc
      POSTGRES_DB: findoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findoc -d findoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
